name: publish-testpypi

# Rehearsal upload to TestPyPI via Trusted Publishing; nothing here touches
# pypi.org. One-time setup on test.pypi.org (Account -> Publishing -> add a
# pending GitHub publisher):
#   owner: Createyouracccount, repository: tzimpact,
#   workflow: publish-testpypi.yml, environment: testpypi
# Then run this workflow by hand (workflow_dispatch) and verify from a clean
# venv:  pip install -i https://test.pypi.org/simple/ tzimpact
#        tzimpact diff 2026b 2026c   # must list the same zones as a local run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
